# ══════════════════════════════════════════════════════════════════════
#  Flowity Content Engine — Blueprint do Render (backend FastAPI)
#  Procedimento completo em infra/deploy/README.md
#
#  - O frontend NÃO fica aqui: vai para a Vercel (frontend/vercel.json).
#  - O banco NÃO fica aqui: é o PostgreSQL do Supabase (DATABASE_URL).
#  - Variáveis com "sync: false" são pedidas no painel na criação do
#    Blueprint. Nenhum segredo é versionado neste arquivo.
# ══════════════════════════════════════════════════════════════════════

services:
  - type: web
    name: flowity-content-engine-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Disco persistente e preDeployCommand exigem plano pago (Starter).
    plan: starter
    region: virginia
    branch: main
    autoDeploy: true
    healthCheckPath: /health

    # Etapa de release: roda antes de cada deploy, numa instância separada.
    # Se a migração falhar, o deploy é cancelado e a versão anterior continua no ar.
    preDeployCommand: alembic upgrade head

    # Comando de produção (sem --reload). O Render injeta $PORT.
    dockerCommand: >-
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}
      --proxy-headers --forwarded-allow-ips='*'"

    # Mídia persistente: imagens geradas/enviadas sobrevivem a restart e deploy.
    disk:
      name: flowity-media
      mountPath: /var/data
      sizeGB: 1

    envVars:
      # Banco — string de conexão do Supabase (pooler, modo sessão, porta 5432)
      - key: DATABASE_URL
        sync: false
      # Autenticação
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY_HOURS
        value: "24"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      # CORS — só a URL do frontend publicado na Vercel (sem barra no final)
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ALLOW_PRIVATE_NETWORK
        value: "false"
      # Mídia — dentro do disco persistente
      - key: MEDIA_DIR
        value: /var/data/media
      # n8n (webhooks de publicação)
      - key: N8N_WEBHOOK_SECRET
        generateValue: true
      # Ollama não roda no Render. Endereço inalcançável de propósito: a conexão
      # falha na hora e a geração cai no template-fallback (ver README).
      - key: OLLAMA_BASE_URL
        value: http://127.0.0.1:11434
      - key: DEBUG
        value: "false"
      - key: PYTHONUNBUFFERED
        value: "1"
