name: Supabase keep-alive

# O plano gratuito do Supabase pausa o projeto depois de ~7 dias sem atividade.
# Este workflow faz uma leitura no banco duas vezes por semana para ele não dormir.
# Precisa do secret SUPABASE_DATABASE_URL (Settings > Secrets and variables > Actions).
# Só lê (SELECT count(*) FROM posts), nunca escreve.
# Observação: o GitHub desliga workflows agendados em repositórios sem commits por 60 dias;
# se isso acontecer, reative em Actions > Supabase keep-alive > Enable workflow.

on:
  schedule:
    - cron: "17 11 * * 1,4"   # segunda e quinta, 08:17 em Brasília
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install "sqlalchemy==2.0.35" "psycopg2-binary==2.9.9"
      - name: Ler o banco
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: python -m app.db.keepalive
